# Builds Elio for Windows, Linux, macOS and Android, publishes a GitHub release, and sends the iOS app to TestFlight.
#
# Push a tag such as v1.2.3 to release. A tag with a hyphen (v1.2.3-beta.1) is published as a pre-release.
# Running the workflow by hand builds everything and keeps the files as workflow artifacts, without a release.
#
# After a release, build/package-managers.sh feeds Homebrew and Scoop: see the "packages" job at the end. Submitting to
# winget is switched off for now (the commented-out "winget" job).
#
# The Android package is signed with the release key when these repository secrets exist, and with a
# throwaway debug key otherwise (such a package installs, but cannot be updated by a later build):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# The iOS app is built, signed and uploaded to TestFlight only when all of these repository secrets exist. Without
# them the "ios" job is skipped with a warning, and the rest of the release goes out as before:
#   IOS_CERTIFICATE_BASE64 (an "Apple Distribution" certificate with its private key, as .p12), IOS_CERTIFICATE_PASSWORD,
#   IOS_PROVISIONING_PROFILE_BASE64 (an App Store provisioning profile for sh.elio.app, the .mobileprovision file),
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, and APP_STORE_CONNECT_KEY (the contents of the
#   AuthKey_<key id>.p8 file of an App Store Connect API key, with the App Manager role)
# A tag sends the build to TestFlight; a run by hand only builds and signs it and keeps the .ipa as a workflow artifact.
#
# What lets copies of Elio update themselves is a signed manifest (update.json) of the release. It is signed with the
# private key in the repository secret UPDATE_SIGNING_KEY, whose public half is in src/Elio.Core/update-keys.txt and so
# in every build. Without the secret the release has no manifest, and copies only announce it. To make the key, run
# build/update-key.sh.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the build, without the leading v
        default: 0.0.0-dev

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.x
  RAW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  # libghostty-vt, built from pinned and checksummed sources rather than taken from the repository.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build for Windows and Linux
        run: sh build/native.sh win-x64 linux-x64 linux-arm64

      # Kept apart, as Android is below: trouble with Windows on ARM costs that build, not the others.
      - name: Build for Windows on ARM
        continue-on-error: true
        run: sh build/native.sh win-arm64

      # Kept apart so that trouble with the NDK costs the Android package, not the desktop builds.
      - name: Build for Android
        continue-on-error: true
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sh build/native.sh android-arm64 android-arm android-x64

      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: native/out
          if-no-files-found: error
          retention-days: 3

  desktop:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          # Windows on ARM, published from an x64 runner as linux-arm64 is. Optional: when it fails, the release goes
          # out without it, and a copy on ARM that tries to update says the release has no build for its system.
          - rid: win-arm64
            os: windows-latest
            optional: true
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: native
          path: native/out

      # The project leaves out an engine that is missing, and a program without it starts and then fails on its first
      # terminal. A build stops here instead of making one.
      - name: Check the terminal engine was built
        run: |
          case "${{ matrix.rid }}" in
            win-*) engine=native/out/${{ matrix.rid }}/bin/ghostty-vt.dll ;;
            *) engine=native/out/${{ matrix.rid }}/lib/libghostty-vt.so ;;
          esac
          test -f "$engine" || { echo "::error::libghostty-vt was not built for ${{ matrix.rid }}"; exit 1; }

      - name: Publish
        run: dotnet publish src/Elio.Desktop -c Release -r ${{ matrix.rid }} -p:Version="${RAW_VERSION#v}" -o publish

      # The Windows zips hold elio-<version>-<rid>/elio.exe, which the in-app updater and the package managers look for.
      - name: Package
        run: |
          version=${RAW_VERSION#v}
          name=elio-$version-${{ matrix.rid }}
          mkdir "$name" dist
          cp LICENSE NOTICE "$name/"
          case "${{ matrix.rid }}" in
            win-*)
              cp publish/elio.exe "$name/"
              7z a -tzip "dist/$name.zip" "$name" > /dev/null
              ;;
            *)
              cp publish/elio "$name/"
              chmod +x "$name/elio"
              tar -czf "dist/$name.tar.gz" "$name"
              sh build/package-deb.sh "$version" ${{ matrix.rid }} publish dist
              ;;
          esac
          ls -l dist

      # Kept apart so that trouble with appimagetool costs the AppImage, not the tar.gz and the .deb. An AppImage does
      # not update itself: like the .deb, it is not in update.json, and Elio started from one only announces a release.
      - name: AppImage
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        continue-on-error: true
        run: sh build/package-appimage.sh "${RAW_VERSION#v}" ${{ matrix.rid }} publish dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  # macOS is built on a Mac from start to finish: the engine needs Apple's SDK to link, and the app has to be
  # put in a bundle and signed there. Without the signing secrets the bundle gets an ad-hoc signature, which
  # opens only after the user allows it in System Settings.
  #   MACOS_CERTIFICATE_BASE64 (a "Developer ID Application" certificate as .p12), MACOS_CERTIFICATE_PASSWORD,
  #   MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)"),
  #   and to notarize: MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_PASSWORD (an app-specific password), MACOS_NOTARY_TEAM_ID
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build the terminal engine
        run: sh build/native-apple.sh ${{ matrix.rid }}

      - name: Publish
        run: dotnet publish src/Elio.Desktop -c Release -r ${{ matrix.rid }} -p:Version="${RAW_VERSION#v}" -o publish

      - name: Import the signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "::warning::No Developer ID certificate is configured, so the app is signed ad hoc."
            exit 0
          fi
          keychain=$RUNNER_TEMP/elio.keychain-db
          password=$(uuidgen)
          echo "$CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/elio.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/elio.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/elio.p12"

      - name: Package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: sh build/package-macos.sh "${RAW_VERSION#v}" ${{ matrix.rid }} publish dist

      - name: Notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          if [ -z "$NOTARY_APPLE_ID" ]; then
            echo "::warning::No notarization account is configured, so macOS will warn before opening the app."
            exit 0
          fi
          xcrun notarytool submit dist/*.zip --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID" --wait

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  android:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: native
          path: native/out

      - name: Check the terminal engine was built
        run: |
          for abi in android-arm64 android-arm android-x64; do
            test -f "native/out/$abi/lib/libghostty-vt.so" || { echo "::error::libghostty-vt was not built for $abi"; exit 1; }
          done

      - run: dotnet workload install android

      - name: Publish
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version=${RAW_VERSION#v}
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/elio.keystore"
            signing=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/elio.keystore"
                     "-p:AndroidSigningKeyAlias=$KEY_ALIAS" -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
                     -p:AndroidSigningKeyPass=env:KEY_PASSWORD)
          else
            echo "::warning::No release keystore is configured, so the package is signed with a debug key."
          fi
          dotnet publish src/Elio.Android -c Release -p:Version="$version" -p:ApplicationDisplayVersion="$version" \
            -p:ApplicationVersion="$GITHUB_RUN_NUMBER" "${signing[@]}" -o publish
          mkdir dist
          cp publish/*-Signed.apk "dist/elio-$version-android.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  # Whether the iOS app can be signed and sent: secrets cannot decide whether a job runs, so this small job looks at
  # them, and the Mac is only started when all of them are there (see the top of this file).
  ios-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          missing=
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
                      APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::The iOS app was not built or sent to TestFlight, because these secrets are not configured:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  # The iPhone and iPad app, built and signed on a Mac and uploaded to TestFlight, from where it is tested and sent to
  # the App Store by hand. It is not put on the releases page: a build signed for the App Store installs from nowhere else.
  ios:
    needs: ios-secrets
    if: ${{ needs.ios-secrets.outputs.ready == 'true' }}
    runs-on: macos-latest
    env:
      # The Xcode the .NET iOS workload was made for. Empty keeps the runner's default; when the build says it needs
      # another, name it as /Applications names it on the runner (26.1 for Xcode_26.1.app).
      XCODE_VERSION: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Choose Xcode
        run: |
          if [ -n "$XCODE_VERSION" ]; then sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"; fi
          xcodebuild -version

      # The engine is linked into the app, so it is built here, on the Mac, as the macOS one is.
      - name: Build the terminal engine
        run: sh build/native-apple.sh ios

      # The project leaves the engine out when the file is missing, and the app would start and then fail.
      - name: Check the terminal engine was built
        run: |
          test -f native/out/ios/ghostty-vt.xcframework/ios-arm64/libghostty-vt-fat.a \
            || { echo "::error::libghostty-vt was not built for iOS"; exit 1; }

      - run: dotnet workload install ios

      - name: Import the signing certificate and the provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain=$RUNNER_TEMP/elio-ios.keychain-db
          password=$(uuidgen)
          echo "$CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/elio-ios.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/elio-ios.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/elio-ios.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o -E '"(Apple|iPhone) Distribution: [^"]+"' | head -1 | tr -d '"')
          [ -n "$identity" ] || { echo "::error::IOS_CERTIFICATE_BASE64 holds no Apple Distribution certificate with its private key."; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          # The build finds the profile by its UUID, in the folders Xcode keeps profiles in.
          echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/elio.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/elio.mobileprovision" > "$RUNNER_TEMP/elio-profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/elio-profile.plist")
          for folder in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$folder"
            cp "$RUNNER_TEMP/elio.mobileprovision" "$folder/$uuid.mobileprovision"
          done
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      # App Store Connect takes a version of three numbers, so a pre-release's "-beta.1" is left out of it, and a build
      # number that grows with every upload, for which the run number serves as it does for Android. A comma would
      # end an MSBuild property, and certificate names such as "Acme, Inc." have one, so it is written as %2C.
      - name: Publish
        run: |
          version=${RAW_VERSION#v}
          short=${version%%[-+]*}
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $short" -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" src/Elio.iOS/Info.plist
          dotnet publish src/Elio.iOS -c Release -r ios-arm64 "-p:CodesignKey=${SIGN_IDENTITY//,/%2C}" "-p:CodesignProvision=$PROFILE_UUID" -o publish
          ipa=$(find publish src/Elio.iOS/bin -name '*.ipa' 2> /dev/null | head -1 || true)
          [ -n "$ipa" ] || { echo "::error::The build left no .ipa."; exit 1; }
          mkdir dist
          cp "$ipa" "dist/elio-$version-ios.ipa"
          ls -l dist

      # altool finds the API key by its id, in a file named the way App Store Connect named it, in this folder.
      - name: Send to TestFlight
        if: ${{ github.ref_type == 'tag' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          keys=$HOME/.appstoreconnect/private_keys
          mkdir -p "$keys"
          trap 'rm -f "$keys/AuthKey_$KEY_ID.p8"' EXIT
          (umask 077 && printf '%s\n' "$KEY" > "$keys/AuthKey_$KEY_ID.p8")
          xcrun altool --upload-app --type ios --file dist/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # Not named release-*, so that the release job does not put it on the releases page.
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [desktop, macos, android]
    # A failed Android or macOS build still lets the Windows and Linux builds out.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For the scripts in build/ and the keys the programs were built to trust.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # The website links to releases/latest/download/<name>, which only keeps working while the names do not
      # change from one release to the next. The version stays in the tag, in the title and inside each package.
      - name: Names without the version
        working-directory: dist
        run: |
          version=${GITHUB_REF_NAME#v}
          for file in elio-"$version"-*; do
            mv "$file" "elio-${file#elio-"$version"-}"
          done
          ls -l

      # What a copy of Elio installs itself from: update.json lists the version and the SHA-256 of each file, and
      # update.json.sig signs it with the key in UPDATE_SIGNING_KEY. Without the secret the release is still
      # published, and copies of Elio only announce it. A pre-release is never offered for installing.
      - name: Signed update manifest
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::No UPDATE_SIGNING_KEY is configured, so this release has no signed manifest and copies of Elio will only announce it."
            exit 0
          fi
          key=$RUNNER_TEMP/update.key
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
          sh build/update-manifest.sh "${GITHUB_REF_NAME#v}" dist "$key"
          rm -f "$key"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Elio ${GITHUB_REF_NAME#v}" --generate-notes "${flags[@]}"

  # Puts the release into the package managers: a Homebrew tap (localtonet/homebrew-tap) and a Scoop bucket
  # (localtonet/scoop-bucket). Each is skipped with a warning while its secret is missing, and a pre-release is
  # never offered. The manifests are made by build/package-managers.sh from the files the release has just published,
  # the winget ones included, so that they are there to submit by hand or when the "winget" job below is turned on.
  #   PACKAGES_TOKEN: a personal access token that can write to the two repositories above
  # (winget, a pull request to microsoft/winget-pkgs, is switched off for now: see the commented-out job at the end.
  #  It would need WINGET_TOKEN, a classic personal access token with public_repo from an account that forked winget-pkgs.)
  packages:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          for name in elio-win-x64.zip elio-win-arm64.zip elio-osx-arm64.zip elio-osx-x64.zip; do
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir dist || true
          done
          ls -l dist

      - name: Write the manifests
        run: sh build/package-managers.sh "${GITHUB_REF_NAME#v}" dist manifests

      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: manifests
          if-no-files-found: error
          retention-days: 7

      - name: Update the Homebrew tap and the Scoop bucket
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::No PACKAGES_TOKEN is configured, so the Homebrew tap and the Scoop bucket were not updated."
            exit 0
          fi
          push() {
            repository=$1 from=$2 to=$3
            [ -e "$from" ] || { echo "::warning::Nothing to publish to $repository."; return 0; }
            git clone --depth 1 "https://x-access-token:$TOKEN@github.com/$repository.git" "$RUNNER_TEMP/$to"
            cp -R "$from"/. "$RUNNER_TEMP/$to/"
            cd "$RUNNER_TEMP/$to"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || { git commit -m "elio ${GITHUB_REF_NAME#v}"; git push; }
            cd "$GITHUB_WORKSPACE"
          }
          push localtonet/homebrew-tap manifests/homebrew homebrew-tap
          push localtonet/scoop-bucket manifests/scoop scoop-bucket

  # Switched off for now: winget-pkgs cannot be submitted to yet. To turn it on again, remove the "# " that starts
  # each line of this job, and the "switched off" notes at the top and above the "packages" job.
  #
  # winget:
  #   needs: packages
  #   if: ${{ !cancelled() && needs.packages.result == 'success' }}
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         name: package-manifests
  #         path: manifests
  #
  #     - name: Submit to winget-pkgs
  #       shell: pwsh
  #       env:
  #         WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
  #       run: |
  #         if (-not $env:WINGET_TOKEN) {
  #           Write-Host "::warning::No WINGET_TOKEN is configured, so winget was not updated."
  #           exit 0
  #         }
  #         if (-not (Test-Path manifests/winget)) {
  #           Write-Host "::warning::This release has no Windows build, so winget was not updated."
  #           exit 0
  #         }
  #         Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
  #         ./wingetcreate.exe submit --token $env:WINGET_TOKEN manifests/winget
